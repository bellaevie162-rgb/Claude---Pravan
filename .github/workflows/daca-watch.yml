name: DACA watch

on:
  schedule:
    - cron: "23 13 * * *"   # once a day, ~8:23am Eastern (GitHub may run it a bit late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: print the digest in the log, don't email"
        type: boolean
        default: false

concurrency:
  group: daca-watch
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers which items were already emailed (kept in the Actions cache).
      - name: Restore seen items
        uses: actions/cache/restore@v4
        with:
          path: daca_state.json
          key: daca-state-${{ github.run_id }}
          restore-keys: daca-state-

      - name: Build and send digest
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python daca_watch.py

      - name: Save seen items
        if: success() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: daca_state.json
          key: daca-state-${{ github.run_id }}
